name: Deploy to Production

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment: prod

    steps:

      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/949358550209/locations/global/workloadIdentityPools/github-pool2/providers/github-provider
          service_account: github-actions@new123456-501605.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - run: |
          echo "PROJECT_ID=$(gcloud secrets versions access latest --secret=PROJECT_ID)" >> $GITHUB_ENV
          echo "GKE_CLUSTER=$(gcloud secrets versions access latest --secret=GKE_CLUSTER)" >> $GITHUB_ENV
          echo "GKE_ZONE=$(gcloud secrets versions access latest --secret=GKE_ZONE)" >> $GITHUB_ENV
          echo "PROD_NAMESPACE=$(gcloud secrets versions access latest --secret=PROD_NAMESPACE)" >> $GITHUB_ENV

      - run: |
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - run: |
          gcloud container clusters get-credentials "$GKE_CLUSTER" \
          --zone "$GKE_ZONE" \
          --project "$PROJECT_ID"

      - run: kubectl apply -k k8s/overlays/prod

      - run: |
          for DEPLOY in $(kubectl get deploy -n ${PROD_NAMESPACE} -o jsonpath='{.items[*].metadata.name}')
          do
            kubectl rollout status deployment/$DEPLOY -n ${PROD_NAMESPACE} --timeout=10m
          done
